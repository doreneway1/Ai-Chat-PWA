<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="doreneAI">
  <title>doreneAI — Orbit Chat</title>
  <!--
    Konsep A "Orbit Chat" (final).
    - Latar squircle gradien diagonal lime #c8f169 -> mint #9de8da.
    - Gelembung chat hijau sangat gelap #14261c (kontras ~12:1 terhadap latar;
      gelembung putih hanya ~1,3:1 sehingga tidak dipakai).
    - Satu cincin orbit tipis yang terputus + titik satelit di ujung busur.
    - Komposisi aman untuk maskable: seluruh elemen penting berada dalam
      lingkaran 80% tengah (jari-jari 204,8 dari pusat).
    - Tanpa filter/shadow agar hasil ekspor identik di semua rasterizer.
  -->
  <defs>
    <linearGradient id="orbit-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8f169"/>
      <stop offset="1" stop-color="#9de8da"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#orbit-bg)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#14261c" stroke-width="15" stroke-linecap="round" stroke-dasharray="935 184" transform="rotate(90 256 256)"/>
  <circle cx="409" cy="348" r="16" fill="#14261c"/>
  <rect x="166" y="178" width="180" height="132" rx="44" fill="#14261c"/>
  <path d="M 196 302 C 188 322, 180 340, 176 356 C 174 366, 186 368, 194 360 L 240 308 Z" fill="#14261c"/>
  <rect x="196" y="220" width="120" height="16" rx="8" fill="#c8f169"/>
  <rect x="196" y="254" width="84" height="16" rx="8" fill="#c8f169"/>
</svg>
