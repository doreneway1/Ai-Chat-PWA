name: Deploy AI Chat PWA

on:
  push:
    branches: [main]
    paths:
      - "projects/ai-chat-pwa/**"
      - ".github/workflows/deploy-ai-chat-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/ai-chat-pwa/package-lock.json
      - name: Install client dependencies
        working-directory: projects/ai-chat-pwa
        run: npm ci
      - name: Build client
        working-directory: projects/ai-chat-pwa
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static client
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/ai-chat-pwa/dist
      - name: Deploy static client
        id: deployment
        uses: actions/deploy-pages@v4
